name: Build Forge Auto Import APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Android SDK
        run: |
          JAVA_HOME=${JAVA_HOME_17_X64} ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "build-tools;35.0.0" "platform-tools" "platforms;android-35"

      - name: Android maven plugin
        run: |
          d=~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          mkdir -p $d
          curl -L -o $d/android-maven-plugin-4.6.2.jar https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar
          curl -L -o $d/android-maven-plugin-4.6.2.pom https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom

      - name: Virtual framebuffer
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Build
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -B -P android-autoimport-build -pl forge-gui-android -am verify \
            -Dandroid.sdk.path=$ANDROID_SDK_ROOT -Dandroid.buildToolsVersion=35.0.0 -Dmaven.test.skip=true -Dapp.build=${{ github.run_number }}

      - name: Sign
        run: |
          APK=$(ls forge-gui-android/target/forge-autoimport-android-*.apk | head -1)
          mkdir -p out && cp "$APK" out/
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            java -jar forge-gui-android/tools/uber-apk-signer.jar -a out --allowResign --overwrite \
              --ks release.keystore --ksAlias "$KS_ALIAS" --ksPass "$KS_PASS" --ksKeyPass "$KS_KEY_PASS"
            rm release.keystore
          else
            echo "::warning::No keystore secrets set - signing with the DEBUG key. Updates over a differently signed install will fail."
            java -jar forge-gui-android/tools/uber-apk-signer.jar -a out --allowResign --overwrite --debug
          fi
          ls -la out

      - name: Package release files
        run: |
          set -e
          APK=$(ls out/*.apk | head -1)
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -1)
          VERSION=$($BT/aapt2 dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "App version: $VERSION"
          test -n "$VERSION"
          mkdir -p release pkg/res
          cp "$APK" "release/forge-android-$VERSION-signed-aligned.apk"
          printf '%s' "$VERSION" > release/version.txt
          date -u '+%Y-%m-%d %H:%M:%S' | tr -d '\n' > release/build.txt
          # assets.zip = what upstream snapshots ship: license files + res/ (with cardsfolder.zip)
          cp forge-gui/LICENSE.txt forge-gui/release-files/*.txt pkg/ 2>/dev/null || true
          mkdir -p pkg/res
          rsync -a --exclude 'cardsfolder' --exclude '*.xcf' forge-gui/res/ pkg/res/
          cp release/build.txt pkg/res/build.txt
          mkdir -p pkg/res/cardsfolder
          (cd forge-gui/res/cardsfolder && zip -qr -1 ../../../pkg/res/cardsfolder/cardsfolder.zip .)
          (cd pkg && zip -qr -1 ../release/assets.zip .)
          ls -la release

      - name: Publish release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest release/* --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Build #${{ github.run_number }} (commit $GITHUB_SHA). The app's built-in updater reads this release."

      - uses: actions/upload-artifact@v4
        with:
          name: forge-auto-import-apk
          path: out/*.apk
          if-no-files-found: error
